services:
  iagis:
    build: .
    restart: unless-stopped
    env_file:
      - ${IAGIS_ENV_FILE:-/etc/iagis/iagis.env}
    # Linux: compartilha somente a pilha de rede do host. Assim 127.0.0.1:11434
    # alcança o Ollama ligado ao loopback sem expô-lo em 0.0.0.0.
    network_mode: host
    command: ["worker", "--entity-id", "${IAGIS_ENTITY_ID:?required}"]
    volumes:
      - iagis_data:/data
      - iagis_reports:/reports
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
  admin:
    build: .
    restart: unless-stopped
    profiles: ["admin"]
    env_file:
      - ${IAGIS_ENV_FILE:-/etc/iagis/iagis.env}
    network_mode: host
    command: ["admin"]
    volumes:
      - iagis_data:/data
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,socket; s=socket.create_connection(('127.0.0.1',int(os.getenv('IAGIS_ADMIN_PORT','8090'))),2); s.close()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  iagis_data:
  iagis_reports:
