[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iagis-agent"
version = "0.1.0"
description = "Agente de homologação documental e governança integrado ao GLPI 11"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.2,<1",
  "google-genai>=1.30,<2",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "requests>=2.32,<3",
  "structlog>=24.4,<26",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<2", "responses>=0.25,<1"]

[project.scripts]
iagis = "iagis.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iagis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
